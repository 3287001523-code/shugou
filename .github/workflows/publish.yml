name: 发布运行结果
on:
  push:
    paths-ignore:
      - "results/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译运行全部程序并保存输出
        run: |
          mkdir -p results
          echo "# GitHub Actions 云端运行 · 运行编号 $GITHUB_RUN_NUMBER · ubuntu-latest" > results/e01_t1.txt
          echo "\$ gcc -w -o prog code/e01_t1.c" >> results/e01_t1.txt
          echo "\$ ./prog < inputs/e01_t1.txt" >> results/e01_t1.txt
          if gcc -w -o prog code/e01_t1.c 2>>results/e01_t1.txt; then
            timeout 60s ./prog < inputs/e01_t1.txt >> results/e01_t1.txt 2>&1 || echo "[运行异常退出]" >> results/e01_t1.txt
          else
            echo "[编译失败]" >> results/e01_t1.txt
          fi
