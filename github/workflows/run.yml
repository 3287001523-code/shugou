          - id: e19_seq1
            prog: e19_seq1
          - id: e19_seq2
            prog: e19_seq2
    steps:
      - uses: actions/checkout@v4
      - name: 编译并运行
        run: |
          echo "======== 程序 ${{ matrix.id }} ========"
          gcc -w -o prog code/${{ matrix.prog }}.c
          echo "-------- 编译成功，开始运行 --------"
          timeout 60s ./prog < inputs/${{ matrix.id }}.txt
          echo "-------- 运行结束 --------"
